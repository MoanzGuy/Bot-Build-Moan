name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Buat APK Dummy
        run: |
          mkdir -p output
          echo "XOW Build Success" > output/telegram.apk
      - uses: actions/upload-artifact@v3
        with:
          name: telegram-bot-apk
          path: output/*.apk
